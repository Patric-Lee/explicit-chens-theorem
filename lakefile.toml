name = "goldbach"
version = "1.0.0"
buildDir = ".lake/build-434"
keywords = ["mathematics", "number-theory", "chen-theorem"]
defaultTargets = ["Goldbach", "MathlibNt", "AnalyticNumberTheory", "PrimeNumberTheoremAnd"]

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "468e8f58fb4ad6e6ad672a08da6d0d0531e95a97"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd.+"]

[[lean_lib]]
name = "AnalyticNumberTheory"
globs = ["AnalyticNumberTheory","AnalyticNumberTheory.+"]

[[lean_lib]]
name = "MathlibNt"
globs = ["MathlibNt","MathlibNt.+"]

[[lean_lib]]
name = "Goldbach"
globs = ["Goldbach","Goldbach.+"]

[[lean_lib]]
name = "OAI"
srcDir = "OpenAI/wrappers"
roots = ["OAI.NumberTheory.DirichletL.Nonvanishing"]
globs = ["OAI.+"]
leanOptions = { autoImplicit = false }

